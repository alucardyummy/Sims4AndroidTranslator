 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f">
<title>Sims 4 Translator · Mesclar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
    --border: #2a2a2a; --border2: #333;
    --accent: #9cb8b2; --accent-dim: #6a9088;
    --text: #f0ece4; --text-muted: #7a7570; --text-dim: #4a4a4a;
    --radius: 16px; --radius-sm: 10px;
  }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  .page { min-height: 100dvh; display: flex; flex-direction: column; padding: 1.25rem 1rem 2rem; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 1.75rem; }
  .back-btn { width: 34px; height: 34px; background: transparent; border: 1px solid transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); text-decoration: none; -webkit-tap-highlight-color: transparent; flex-shrink: 0; transition: color 0.15s; }
  .back-btn:active { color: var(--accent); }
  .back-btn svg { width: 17px; height: 17px; }
  .topbar-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-muted); text-transform: uppercase; }

  .section-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.75rem; padding-left: 2px; }
  .separator { height: 1px; background: var(--border); margin: 1.25rem 0; }

  /* Drop zone */
  .drop-zone { border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 2.25rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.65rem; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color 0.25s, background 0.25s; margin-bottom: 1.25rem; position: relative; overflow: hidden; }
  .drop-zone::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(156,184,178,0.05) 0%, transparent 70%); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .drop-zone.has-files { border-color: var(--accent-dim); }
  .drop-zone.has-files::before { opacity: 1; }
  .drop-zone:active { background: rgba(156,184,178,0.03); }
  .drop-zone-icon { font-size: 22px; color: var(--text-dim); transition: color 0.25s, transform 0.3s; }
  .drop-zone.has-files .drop-zone-icon { color: var(--accent); transform: scale(1.15); }
  .drop-zone-label { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; }
  .drop-zone-sub { font-size: 11px; color: var(--text-dim); text-align: center; line-height: 1.6; }
  #file-input, #split-file-input { display: none; }

  /* Lista de arquivos */
  .file-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 1rem; }
  .file-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); transition: border-color 0.15s; animation: itemIn 0.22s ease; }
  @keyframes itemIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
  .file-item-index { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim); flex-shrink: 0; width: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  .file-item-name { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item-size { font-size: 10px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; }
  .file-item-remove { width: 22px; height: 22px; background: transparent; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; border-radius: 4px; transition: color 0.15s; }
  .file-item-remove:active { color: #c08080; }

  .file-count { font-size: 10px; color: var(--text-dim); text-align: center; margin-bottom: 0.5rem; font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

  /* Botão mesclar */
  .merge-btn { width: 100%; padding: 17px; background: var(--accent-dim); border: none; border-radius: var(--radius); color: #080808; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; -webkit-tap-highlight-color: transparent; margin-top: auto; transition: background 0.15s, transform 0.1s, opacity 0.2s; }
  .merge-btn:active { background: var(--accent); transform: scale(0.97); }
  .merge-btn:disabled { opacity: 0.2; pointer-events: none; }

  /* Abas de modo (Mesclar rapidinho / com memória / Separar) */
  .mode-tabs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
  .mode-tab { text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color 0.15s, background 0.15s; }
  .mode-tab:active { background: rgba(156,184,178,0.04); }
  .mode-tab.selected { border-color: var(--accent-dim); background: rgba(156,184,178,0.06); }
  .mode-tab-title { font-family: 'Syne', sans-serif; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--text); display: flex; align-items: center; gap: 7px; }
  .mode-tab-title .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--text-dim); flex-shrink: 0; transition: background 0.15s, border-color 0.15s; }
  .mode-tab.selected .mode-tab-title .dot { background: var(--accent); border-color: var(--accent); }
  .mode-tab-sub { font-size: 10.5px; color: var(--text-dim); line-height: 1.5; margin-top: 3px; }

  /* Resultado da separação */
  .split-result-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); animation: itemIn 0.22s ease; }
  .split-result-info { flex: 1; min-width: 0; }
  .split-result-name { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .split-result-meta { font-size: 9.5px; color: var(--text-dim); margin-top: 2px; }
  .split-download-btn { width: 30px; height: 30px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent; transition: background 0.15s, transform 0.1s; }
  .split-download-btn:active { background: var(--accent-dim); color: #080808; transform: scale(0.92); }
  .split-download-btn svg { width: 15px; height: 15px; }
  .split-badge { font-size: 10px; letter-spacing: 0.03em; padding: 7px 11px; border-radius: 8px; margin-bottom: 0.9rem; line-height: 1.5; }
  .split-badge.exact { background: rgba(156,184,178,0.08); color: var(--accent); border: 1px solid rgba(156,184,178,0.2); }
  .split-badge.guess { background: rgba(176,112,112,0.08); color: #c08585; border: 1px solid rgba(176,112,112,0.2); }

  /* Loading */
  .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(15,15,15,0.92); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
  .loading-overlay.active { display: flex; }
  .loading-gif { width: 54px; height: 54px; object-fit: contain; border-radius: 50%; }
  .loading-phrase-container { position: relative; min-height: 18px; display: flex; align-items: center; justify-content: center; max-width: 260px; padding: 0 12px; }
  .loading-phrase { font-size: 13px; color: var(--text-muted); letter-spacing: 0.04em; text-align: center; line-height: 1.5; animation: phraseInOut 4.8s ease forwards; }
  @keyframes phraseInOut {
    0%   { opacity: 0; transform: translateX(-18px); }
    14%  { opacity: 1; transform: translateX(0); }
    82%  { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(18px); }
  }
  .loading-text { font-size: 11px; color: var(--text-muted); letter-spacing: 0.06em; font-family: 'DM Mono', monospace; }

  /* Toast */
  .toast { position: fixed; bottom: 2rem; left: 1rem; right: 1rem; background: #1c1212; border: 1px solid #3a2020; border-radius: var(--radius-sm); padding: 11px 16px; font-size: 12px; color: #b07070; z-index: 200; display: none; text-align: center; letter-spacing: 0.03em; }
  .toast.show { display: block; animation: fadeInUp 0.22s ease; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Busca */
  .search-wrap { position: relative; margin-bottom: 0.65rem; display: none; }
  .search-wrap.visible { display: block; animation: fadeInUp 0.2s ease; }
  .search-input { width: 100%; padding: 9px 12px 9px 33px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px; outline: none; -webkit-appearance: none; transition: border-color 0.15s; }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: var(--border2); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 12px; pointer-events: none; }
  .search-count { font-size: 10px; color: var(--text-dim); text-align: right; margin-top: -0.4rem; margin-bottom: 0.5rem; display: none; font-family: 'DM Mono', monospace; }
  .search-count.visible { display: block; }
  .file-item.hidden { display: none; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a href="/" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </a>
    <div class="topbar-title">Mesclar .packages</div>
  </div>

  <div class="mode-tabs" id="mode-tabs">
    <button class="mode-tab selected" data-mode="simple" onclick="switchMode('simple')">
      <div class="mode-tab-title"><span class="dot"></span>Mesclar rapidinho</div>
      <div class="mode-tab-sub">Junta tudo num arquivo só. Não dá pra separar de volta depois.</div>
    </button>
    <button class="mode-tab" data-mode="smart" onclick="switchMode('smart')">
      <div class="mode-tab-title"><span class="dot"></span>Mesclar com memória</div>
      <div class="mode-tab-sub">Junta tudo, mas guarda um mapinha de cada arquivo — dá pra separar de volta quando quiser.</div>
    </button>
    <button class="mode-tab" data-mode="split" onclick="switchMode('split')">
      <div class="mode-tab-title"><span class="dot"></span>Separar arquivo mesclado</div>
      <div class="mode-tab-sub">Importa um .package já mesclado e baixa os arquivos originais separados.</div>
    </button>
  </div>

  <div id="merge-section">
    <div class="section-label">Arquivos selecionados</div>

    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="drop-zone-icon">◈</div>
      <div class="drop-zone-label">Selecionar arquivos</div>
      <div class="drop-zone-sub">Toque para escolher os .package<br>que deseja juntar num só</div>
    </div>
    <input type="file" id="file-input" accept=".package" multiple>

    <div class="search-wrap" id="search-wrap">
      <span class="search-icon">◎</span>
      <input class="search-input" id="search-input" type="text" placeholder="Buscar arquivo..." oninput="filterList()">
    </div>
    <div class="search-count" id="search-count"></div>
    <div class="file-list" id="file-list"></div>
    <div class="file-count" id="file-count"></div>

    <div class="separator"></div>

    <button class="merge-btn" id="merge-btn" onclick="doMerge()" disabled>MESCLAR E BAIXAR</button>
  </div>

  <div id="split-section" style="display:none;">
    <div class="section-label">Arquivo mesclado</div>

    <div class="drop-zone" id="split-drop-zone" onclick="document.getElementById('split-file-input').click()">
      <div class="drop-zone-icon">◈</div>
      <div class="drop-zone-label" id="split-drop-label">Selecionar .package</div>
      <div class="drop-zone-sub" id="split-drop-sub">Toque para escolher o .package<br>já mesclado que quer separar</div>
    </div>
    <input type="file" id="split-file-input" accept=".package">

    <div id="split-results-wrap" style="display:none;">
      <div class="separator"></div>
      <div class="split-badge" id="split-badge"></div>
      <div class="section-label">Arquivos encontrados</div>
      <div class="file-list" id="split-results-list"></div>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <img class="loading-gif" id="loading-gif" src="/img/loading.webp" alt="">
  <div class="loading-phrase-container" id="loading-phrase-container"></div>
  <div class="loading-text" id="loading-text">Mesclando...</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- FRASES BOBAS DA TELA DE CARREGAMENTO ----
// Mesmo carrossel do index.html/editor.html. A frase boba roda por cima e o
// status real ("Mesclando...", "Separando arquivos...") continua visível
// por baixo ao mesmo tempo — assim, se travar, dá pra saber o que estava
// rolando sem perder a graça enquanto espera.
const LOADING_PHRASES = [
  'sorvete',
  'Você sabia que as lontras-marinhas dão as mãos enquanto dormem?',
  'gatinhos pãozinhos',
  'isso não tem nada a ver com o carregamento',
  'respira fundo',
  'em algum lugar, uma capivara está tranquila',
  'polvos têm três corações',
  'pipoca',
  '🦦🦦🦦',
  'chinelo quentinho',
  'os corvos lembram do seu rosto pra sempre',
  'seu Sim provavelmente também tá esperando alguma coisa agora',
  'coelhos pulam de lado quando estão felizes (se chama "binky")',
  '🐌 devagar e sempre',
  'estrelas-do-mar não têm cérebro e vivem numa boa assim mesmo',
  'cheiro de livro novo',
  '☁️ nuvem passando, nada a declarar',
  'pinguins pedem casamento oferecendo uma pedrinha',
  'isso é café pra sua paciência',
  'um Sim em algum lugar tá fazendo xixi na calça agora',
  'meia saindo quentinha da secadora',
  'abelhas dançam pra dar as coordenadas do pólen',
  '🍕🍕🍕',
  'shh, deixa isso pensando em paz',
  'flanela macia recém-lavada',
  'em algum lugar um gato espirrou bem baixinho',
  'isso é só o universo pigarreando',
  '🌻 girassol seguindo o sol, devagarinho',
  'capim balançando sem pressa nenhuma',
  'o plumbob tá verde, relaxa',
  'tem um Sim preso numa piscina sem escada em algum lugar',
  'um Sim brigou com a torradeira agora mesmo e perdeu',
  'um gnomo de jardim sumiu e ninguém sabe pra onde foi',
  'um Sim tá cantando em Simlish no chuveiro',
  'alguém esqueceu a panela no fogo lá na vizinhança',
];
let _lastPhraseIdx = -1;
let _phrasesRunning = false;

function pickLoadingPhrase() {
  if (LOADING_PHRASES.length === 1) return LOADING_PHRASES[0];
  let i;
  do { i = Math.floor(Math.random() * LOADING_PHRASES.length); } while (i === _lastPhraseIdx);
  _lastPhraseIdx = i;
  return LOADING_PHRASES[i];
}

function loadingPhraseCycle() {
  const container = document.getElementById('loading-phrase-container');
  if (!container || !_phrasesRunning) return;
  const el = document.createElement('div');
  el.className = 'loading-phrase';
  el.textContent = pickLoadingPhrase();
  el.addEventListener('animationend', () => {
    el.remove();
    loadingPhraseCycle();
  });
  container.appendChild(el);
}

function startLoadingPhrases() {
  _phrasesRunning = true;
  loadingPhraseCycle();
}

function stopLoadingPhrases() {
  _phrasesRunning = false;
  const container = document.getElementById('loading-phrase-container');
  if (container) container.innerHTML = '';
}

let selectedFiles = [];
let currentMode = 'simple'; // 'simple' | 'smart' | 'split'
let splitFile = null;
let splitParts = []; // [{filename, size, resource_count, data_b64}]

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(el => {
    el.classList.toggle('selected', el.dataset.mode === mode);
  });
  document.getElementById('merge-section').style.display = (mode === 'split') ? 'none' : 'block';
  document.getElementById('split-section').style.display = (mode === 'split') ? 'block' : 'none';

  const btn = document.getElementById('merge-btn');
  btn.textContent = (mode === 'smart') ? 'MESCLAR COM MEMÓRIA' : 'MESCLAR E BAIXAR';
}

document.getElementById('file-input').addEventListener('change', function() {
  addFiles(Array.from(this.files));
  this.value = '';
});

function addFiles(newFiles) {
  for (const f of newFiles) {
    if (!f.name.endsWith('.package')) {
      showToast('Apenas arquivos .package são aceitos.');
      continue;
    }
    const already = selectedFiles.some(x => x.name === f.name && x.size === f.size);
    if (!already) selectedFiles.push(f);
  }
  renderList();
}

function removeFile(idx) {
  selectedFiles.splice(idx, 1);
  renderList();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' kB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderList() {
  const list = document.getElementById('file-list');
  const count = document.getElementById('file-count');
  const btn = document.getElementById('merge-btn');
  const drop = document.getElementById('drop-zone');

  list.innerHTML = '';
  selectedFiles.forEach((f, idx) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML =
      '<span class="file-item-index">' + (idx + 1) + '</span>' +
      '<span class="file-item-name">' + f.name + '</span>' +
      '<span class="file-item-size">' + formatSize(f.size) + '</span>' +
      '<button class="file-item-remove" onclick="removeFile(' + idx + ')">✕</button>';
    list.appendChild(item);
  });

  const n = selectedFiles.length;
  const totalBytes = selectedFiles.reduce((acc, f) => acc + f.size, 0);
  const totalStr = totalBytes < 1024 * 1024
    ? (totalBytes / 1024).toFixed(1) + ' kB'
    : (totalBytes / (1024 * 1024)).toFixed(2) + ' MB';
  count.textContent = n > 0 ? n + ' arquivo' + (n !== 1 ? 's' : '') + ' · ~' + totalStr : '';
  btn.disabled = n < 2;
  drop.classList.toggle('has-files', n > 0);

  const sub = document.querySelector('#merge-section .drop-zone-sub');
  sub.textContent = n > 0 ? 'Toque para adicionar mais arquivos' : 'Toque para escolher os .package\nque deseja juntar num só';

  document.getElementById('search-wrap').classList.toggle('visible', n > 0);
  if (n === 0) {
    document.getElementById('search-input').value = '';
    document.getElementById('search-count').classList.remove('visible');
  }
}

async function doMerge() {
  if (selectedFiles.length < 2) return;

  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');
  loading.classList.add('active');
  loadingText.textContent = 'Mesclando ' + selectedFiles.length + ' arquivos...';
  startLoadingPhrases();

  try {
    const formData = new FormData();
    selectedFiles.forEach(f => formData.append('packages', f));
    formData.append('mode', currentMode === 'smart' ? 'smart' : 'simple');

    const res = await fetch('/api/merge', { method: 'POST', body: formData });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Erro ao mesclar');
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'merged.package';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    loading.classList.remove('active');
    stopLoadingPhrases();
  } catch(e) {
    loading.classList.remove('active');
    stopLoadingPhrases();
    showToast(e.message || 'Erro ao mesclar os arquivos.');
  }
}

// ---- Separar arquivo mesclado ----

document.getElementById('split-file-input').addEventListener('change', function() {
  const f = this.files[0];
  this.value = '';
  if (!f) return;
  if (!f.name.endsWith('.package')) {
    showToast('Apenas arquivos .package são aceitos.');
    return;
  }
  splitFile = f;
  document.getElementById('split-drop-zone').classList.add('has-files');
  document.getElementById('split-drop-label').textContent = f.name;
  document.getElementById('split-drop-sub').textContent = 'Toque para trocar o arquivo';
  doSplit();
});

async function doSplit() {
  if (!splitFile) return;

  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');
  loading.classList.add('active');
  loadingText.textContent = 'Separando arquivos...';
  startLoadingPhrases();
  document.getElementById('split-results-wrap').style.display = 'none';

  try {
    const formData = new FormData();
    formData.append('package', splitFile);

    const res = await fetch('/api/unmerge', { method: 'POST', body: formData });
    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data.success) {
      throw new Error(data.error || 'Erro ao separar o arquivo');
    }

    splitParts = data.parts || [];
    renderSplitResults(data.exact);
    loading.classList.remove('active');
    stopLoadingPhrases();
  } catch(e) {
    loading.classList.remove('active');
    stopLoadingPhrases();
    showToast(e.message || 'Erro ao separar o arquivo.');
  }
}

function renderSplitResults(exact) {
  const badge = document.getElementById('split-badge');
  if (exact) {
    badge.className = 'split-badge exact';
    badge.textContent = '✓ Esse arquivo tinha o mapinha de origem — separação exata, cada parte é idêntica ao arquivo original.';
  } else {
    badge.className = 'split-badge guess';
    badge.textContent = '⚠ Esse arquivo não tinha mapinha de origem (não foi mesclado com "memória"). Separamos por um palpite baseado em Group ID — pode não bater 100% com os arquivos originais.';
  }

  const list = document.getElementById('split-results-list');
  list.innerHTML = '';
  splitParts.forEach((p, idx) => {
    const item = document.createElement('div');
    item.className = 'split-result-item';
    item.innerHTML =
      '<div class="split-result-info">' +
        '<div class="split-result-name">' + p.filename + '</div>' +
        '<div class="split-result-meta">' + formatSize(p.size) + ' · ' + p.resource_count + ' recurso' + (p.resource_count !== 1 ? 's' : '') + '</div>' +
      '</div>' +
      '<button class="split-download-btn" onclick="downloadSplitPart(' + idx + ')" title="Baixar">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M12 4v13m0 0l-5-5m5 5l5-5M5 20h14"/>' +
        '</svg>' +
      '</button>';
    list.appendChild(item);
  });

  document.getElementById('split-results-wrap').style.display = 'block';
}

function downloadSplitPart(idx) {
  const p = splitParts[idx];
  if (!p) return;
  const byteChars = atob(p.data_b64);
  const bytes = new Uint8Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = p.filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function filterList() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const items = document.querySelectorAll('#merge-section .file-item');
  let visible = 0;
  items.forEach(item => {
    const name = item.querySelector('.file-item-name').textContent.toLowerCase();
    const match = !q || name.includes(q);
    item.classList.toggle('hidden', !match);
    if (match) visible++;
  });
  const countEl = document.getElementById('search-count');
  if (q) {
    countEl.textContent = visible + ' de ' + selectedFiles.length + ' arquivo' + (selectedFiles.length !== 1 ? 's' : '');
    countEl.classList.add('visible');
  } else {
    countEl.classList.remove('visible');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
