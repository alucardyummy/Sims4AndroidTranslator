<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<title>Sims 4 · Inspecionar Package</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
    --border: #2a2a2a; --border2: #333;
    --accent: #c8a96e; --accent-dim: #8a6f42;
    --text: #f0ece4; --text-muted: #7a7570;
    --radius: 16px; --radius-sm: 10px;
  }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  .page { min-height: 100dvh; display: flex; flex-direction: column; padding: 1.25rem 1rem 3rem; max-width: 600px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 1.75rem; }
  .back-btn { width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); text-decoration: none; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .back-btn svg { width: 18px; height: 18px; }
  .page-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); }
  .page-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .upload-area { border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 2.5rem 1rem; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; margin-bottom: 1.5rem; transition: border-color 0.15s; }
  .upload-area:active { border-color: var(--accent-dim); background: rgba(200,169,110,0.03); }
  .upload-icon { font-size: 36px; margin-bottom: 0.75rem; opacity: 0.5; }
  .upload-label { font-family: 'Syne', sans-serif; font-size: 14px; color: var(--text-muted); font-weight: 600; }
  .upload-hint { font-size: 11px; color: var(--text-muted); opacity: 0.6; margin-top: 6px; }
  .spinner-wrap { display: none; text-align: center; padding: 2rem; }
  .spinner-wrap.active { display: block; }
  .spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-label { font-size: 13px; color: var(--text-muted); }
  .results { display: none; }
  .results.active { display: block; }
  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px; }
  .result-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent); word-break: break-all; }
  .result-count { font-size: 11px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-family: 'DM Mono', monospace; flex-shrink: 0; }
  .section-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 1.25rem 0 0.6rem; padding-left: 2px; }
  .summary-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.5rem; }
  .summary-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .summary-name { font-size: 12px; color: var(--text); font-family: 'DM Mono', monospace; }
  .summary-badge { font-size: 11px; color: var(--accent); background: rgba(200,169,110,0.1); border-radius: 6px; padding: 2px 8px; font-family: 'DM Mono', monospace; flex-shrink: 0; }
  .toggle-btn { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 12px; cursor: pointer; margin: 0.75rem 0 0; -webkit-tap-highlight-color: transparent; }
  .toggle-btn:active { background: var(--surface2); }
  .collapsible { display: none; margin-top: 8px; }
  .collapsible.open { display: block; }
  .resource-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; overflow: hidden; }
  .resource-card-header { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; -webkit-tap-highlight-color: transparent; }
  .resource-card-header:active { background: var(--surface2); }
  .resource-card-title { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text); }
  .resource-card-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .resource-card-arrow { font-size: 10px; color: var(--text-muted); flex-shrink: 0; transition: transform 0.15s; }
  .resource-card-arrow.open { transform: rotate(180deg); }
  .resource-card-body { display: none; border-top: 1px solid var(--border); padding: 10px 14px; }
  .resource-card-body.open { display: block; }
  .hex-dump { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-muted); line-height: 1.8; word-break: break-all; white-space: pre-wrap; background: var(--surface2); border-radius: 6px; padding: 10px; margin-top: 8px; max-height: 200px; overflow-y: auto; }
  .hex-row { display: flex; gap: 12px; }
  .hex-offset { color: var(--accent-dim); flex-shrink: 0; }
  .hex-bytes { flex: 1; }
  .hex-ascii { color: var(--text-muted); flex-shrink: 0; }
  .load-hex-btn { width: 100%; padding: 7px; background: transparent; border: 1px solid var(--border2); border-radius: 6px; color: var(--text-muted); font-size: 11px; cursor: pointer; margin-top: 8px; -webkit-tap-highlight-color: transparent; }
  .load-hex-btn:active { background: var(--surface2); }
  .copy-btn { padding: 5px 10px; background: transparent; border: 1px solid var(--border2); border-radius: 6px; color: var(--text-muted); font-size: 10px; cursor: pointer; margin-top: 6px; -webkit-tap-highlight-color: transparent; }
  .copy-btn:active { background: var(--surface2); }
  .new-btn { width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text-muted); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 1.5rem; -webkit-tap-highlight-color: transparent; }
  .new-btn:active { background: var(--surface2); }
  .error-box { background: rgba(200,60,60,0.1); border: 1px solid rgba(200,60,60,0.3); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; color: #e07070; text-align: center; margin-bottom: 1rem; display: none; }
  .error-box.active { display: block; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a href="/" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </a>
    <div>
      <div class="page-title">Inspecionar .package</div>
      <div class="page-sub">Lista recursos e conteúdo binário</div>
    </div>
  </div>

  <div class="error-box" id="error-box"></div>

  <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
    <div class="upload-icon">🔍</div>
    <div class="upload-label">Selecionar arquivo .package</div>
    <div class="upload-hint">Toque para escolher do celular</div>
  </div>
  <input type="file" id="file-input" accept=".package" style="display:none">

  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    <div class="spinner-label">Lendo arquivo...</div>
  </div>

  <div class="results" id="results">
    <div class="result-header">
      <div class="result-title" id="result-filename">—</div>
      <div class="result-count" id="result-count">—</div>
    </div>

    <div class="section-label">Resumo por tipo</div>
    <div class="summary-list" id="summary-list"></div>
<button class="toggle-btn" onclick="testCasp()" id="btn-test-casp" style="margin-top:8px">🧪 Testar parser CASP</button>
<div id="casp-result" style="margin-top:8px"></div>
    <div class="section-label">Recursos individuais</div>
    <button class="toggle-btn" id="toggle-resources" onclick="toggleResources()">▾ Mostrar todos os recursos</button>
    <div class="collapsible" id="resources-list"></div>

    <button class="new-btn" onclick="resetInspector()">↺ Inspecionar outro arquivo</button>
  </div>
</div>

<script>
let resourcesOpen = false;
let allResources = [];
let currentFile = null;

document.getElementById('file-input').addEventListener('change', async function() {
  const file = this.files[0];
  if (!file) return;
  if (!file.name.endsWith('.package')) { showError('Selecione um arquivo .package válido.'); return; }
  currentFile = file;
  hideError();
  document.getElementById('upload-area').style.display = 'none';
  document.getElementById('spinner').classList.add('active');
  document.getElementById('results').classList.remove('active');

  try {
    const formData = new FormData();
    formData.append('package', file);
    const res = await fetch('/api/inspect_package', { method: 'POST', body: formData });
    const data = await res.json();
    document.getElementById('spinner').classList.remove('active');

    if (!data.success) { showError(data.error || 'Erro ao inspecionar.'); document.getElementById('upload-area').style.display = ''; return; }

    allResources = data.resources;
    document.getElementById('result-filename').textContent = file.name;
    document.getElementById('result-count').textContent = data.total + ' recursos';

    // Resumo
    const summaryEl = document.getElementById('summary-list');
    summaryEl.innerHTML = '';
    Object.entries(data.summary).sort((a, b) => b[1] - a[1]).forEach(([name, count]) => {
      const item = document.createElement('div');
      item.className = 'summary-item';
      item.innerHTML = '<span class="summary-name">' + name + '</span><span class="summary-badge">×' + count + '</span>';
      summaryEl.appendChild(item);
    });

    // Recursos individuais
    buildResourceCards(data.resources);
    document.getElementById('results').classList.add('active');
  } catch(e) {
    document.getElementById('spinner').classList.remove('active');
    document.getElementById('upload-area').style.display = '';
    showError('Erro de conexão: ' + e.message);
  }
  this.value = '';
});

function buildResourceCards(resources) {
  const container = document.getElementById('resources-list');
  container.innerHTML = '';
  resources.forEach((r, idx) => {
    const card = document.createElement('div');
    card.className = 'resource-card';
    card.innerHTML =
      '<div class="resource-card-header" onclick="toggleCard(' + idx + ')">' +
        '<div>' +
          '<div class="resource-card-title">' + r.type_hex + ' — ' + r.type_name + '</div>' +
          '<div class="resource-card-sub">group: ' + r.group + ' &nbsp;·&nbsp; instance: ' + r.instance + '</div>' +
        '</div>' +
        '<div class="resource-card-arrow" id="arrow-' + idx + '">▾</div>' +
      '</div>' +
      '<div class="resource-card-body" id="body-' + idx + '">' +
        '<button class="load-hex-btn" onclick="loadHex(' + idx + ', event)">📋 Carregar dump hex</button>' +
        '<div id="hex-' + idx + '"></div>' +
      '</div>';
    container.appendChild(card);
  });
}

function toggleCard(idx) {
  const body = document.getElementById('body-' + idx);
  const arrow = document.getElementById('arrow-' + idx);
  const isOpen = body.classList.toggle('open');
  arrow.classList.toggle('open', isOpen);
}

function toggleResources() {
  resourcesOpen = !resourcesOpen;
  const el = document.getElementById('resources-list');
  const btn = document.getElementById('toggle-resources');
  el.classList.toggle('open', resourcesOpen);
  btn.textContent = resourcesOpen ? '▴ Ocultar recursos' : '▾ Mostrar todos os recursos';
}

async function loadHex(idx, event) {
  event.stopPropagation();
  const btn = event.target;
  const hexEl = document.getElementById('hex-' + idx);
  if (hexEl.innerHTML !== '') { hexEl.innerHTML = ''; btn.textContent = '📋 Carregar dump hex'; return; }

  btn.textContent = 'Carregando...';
  btn.disabled = true;

  try {
    const r = allResources[idx];
    const formData = new FormData();
    formData.append('package', currentFile);
    formData.append('type_hex', r.type_hex);
    formData.append('group', r.group);
    formData.append('instance', r.instance);

    const res = await fetch('/api/inspect_resource', { method: 'POST', body: formData });
    const data = await res.json();

    if (!data.success) { hexEl.innerHTML = '<div style="color:#e07070;font-size:11px">Erro: ' + data.error + '</div>'; return; }

    const hex = data.hex;
    const size = data.size;

    let html = '<div style="font-size:10px;color:var(--text-muted);margin-bottom:6px">' + size + ' bytes descomprimido</div>';
    html += '<div class="hex-dump">';

    // Formata em linhas de 16 bytes
    for (let i = 0; i < hex.length; i += 32) {
      const chunk = hex.slice(i, i + 32);
      const offset = (i / 2).toString(16).padStart(4, '0');
      let bytes = '';
      let ascii = '';
      for (let j = 0; j < chunk.length; j += 2) {
        const byte = chunk.slice(j, j + 2);
        bytes += byte + ' ';
        const code = parseInt(byte, 16);
        ascii += (code >= 32 && code < 127) ? String.fromCharCode(code) : '.';
      }
      html += '<div class="hex-row"><span class="hex-offset">' + offset + '</span><span class="hex-bytes">' + bytes.trim() + '</span><span class="hex-ascii">' + ascii + '</span></div>';
    }
    html += '</div>';
    html += '<button class="copy-btn" onclick="copyHex(\'' + idx + '\', \'' + hex + '\')">📋 Copiar hex completo</button>';

    hexEl.innerHTML = html;
    btn.textContent = '✕ Ocultar dump';
    btn.disabled = false;
  } catch(e) {
    hexEl.innerHTML = '<div style="color:#e07070;font-size:11px">Erro de conexão</div>';
    btn.textContent = '📋 Carregar dump hex';
    btn.disabled = false;
  }
}

function copyHex(idx, hex) {
  navigator.clipboard.writeText(hex).then(() => {
    alert('Hex copiado! (' + (hex.length / 2) + ' bytes)');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = hex;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Hex copiado!');
  });
}

function resetInspector() {
  document.getElementById('results').classList.remove('active');
  document.getElementById('upload-area').style.display = '';
  document.getElementById('resources-list').classList.remove('open');
  resourcesOpen = false;
  document.getElementById('toggle-resources').textContent = '▾ Mostrar todos os recursos';
  currentFile = null;
  allResources = [];
}

async function testCasp() {
  if (!currentFile) return;
  document.getElementById('btn-test-casp').textContent = 'Testando...';
  const formData = new FormData();
  formData.append('package', currentFile);
  const res = await fetch('/api/test_casp', { method: 'POST', body: formData });
  const data = await res.json();
  const el = document.getElementById('casp-result');
  if (data.success) {
    el.innerHTML =
      '<div style="background:var(--surface);border:1px solid ' + (data.roundtrip_ok ? '#4caf50' : '#f44336') + ';border-radius:10px;padding:12px;font-family:DM Mono,monospace;font-size:10px;color:var(--text-muted);line-height:1.8">' +
      '<b style="color:' + (data.roundtrip_ok ? '#4caf50' : '#f44336') + '">' + (data.roundtrip_ok ? '✓ Roundtrip OK!' : '✕ Diff em byte ' + data.diff_at_byte) + '</b><br>' +
      Object.entries(data.summary).map(([k,v]) => k + ': <span style="color:var(--text)">' + JSON.stringify(v) + '</span>').join('<br>') +
      '</div>';
  } else {
    el.innerHTML = '<div style="color:#e07070;font-size:12px">' + data.error + '</div>';
  }
  document.getElementById('btn-test-casp').textContent = '🧪 Testar parser CASP';
}

function showError(msg) { const el = document.getElementById('error-box'); el.textContent = msg; el.classList.add('active'); }
function hideError() { document.getElementById('error-box').classList.remove('active'); }
</script>
</body>
</html>
