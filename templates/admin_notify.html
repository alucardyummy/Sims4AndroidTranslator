<body>
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <p id="confirm-text">Realmente apagar?</p>
      <div class="confirm-actions">
        <button type="button" class="btn-no" onclick="closeConfirm(false)">Não</button>
        <button type="button" class="btn-yes" onclick="closeConfirm(true)">Sim</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h1 style="display:flex; align-items:center; gap:10px;">
      <svg width="26" height="24" viewBox="0 0 26 24" style="flex-shrink:0;">
        <path d="M3 10 L19 5 Q21 4.3 21 6.3 L21 17.7 Q21 19.7 19 19 L3 14 Z" fill="#6b5589" stroke="#5a4d80" stroke-width="0.8" stroke-linejoin="round"/>
        <path d="M9.5 15.6 Q8.8 19.5 11.8 20.3 Q14.3 21 14.2 18.2 L13.6 15.2" fill="#5a4d80" opacity="0.9"/>
        <path d="M23 8 Q25.3 12 23 16" stroke="#8a7fa6" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <path d="M22.6 9.8 Q24 12 22.6 14.2" stroke="#8a7fa6" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.8"/>
      </svg>
      Enviar Novidade
    </h1>
    <p class="sub">Dispara uma notificação push pra todo mundo inscrito.</p>

    <label for="secret">Segredo de admin</label>
    <input type="password" id="secret" placeholder="X-Admin-Secret" autocomplete="off">
    <div class="remember">
      <input type="checkbox" id="remember" class="cb-custom">
      <label for="remember" style="margin:0;">Lembrar neste navegador</label>
    </div>

    <label for="title">Título</label>
    <input type="text" id="title" placeholder="Ex: Tradução atualizada!" maxlength="80">

    <label for="body">Mensagem</label>
    <textarea id="body" rows="3" placeholder="Ex: Já dá pra baixar a versão nova." maxlength="200"></textarea>

    <label for="url">Link ao clicar (opcional)</label>
    <input type="text" id="url" placeholder="/ (padrão)">

    <button id="send-btn" onclick="sendNotification()">Enviar notificação</button>

    <div id="msg" class="msg"></div>

    <label style="margin-top:28px; display:flex; align-items:center; justify-content:space-between;">
      <span>Novidades enviadas</span>
      <span id="selected-count" style="color:#777; font-weight:400;"></span>
    </label>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button type="button" onclick="toggleSelectAll()" style="all:unset; cursor:pointer; font-size:12px; color:#8a7fa6; padding:4px 8px;" id="select-all-btn">Selecionar tudo</button>
      <button type="button" onclick="deleteSelected()" style="all:unset; cursor:pointer; font-size:12px; color:#ff9b9b; padding:4px 8px; display:inline-flex; align-items:center; gap:5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Apagar selecionados
      </button>
    </div>
    <div id="updates-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

<script>
  const selectedIds = new Set();

  function pl(n, singular, plural) {
    return n === 1 ? singular : plural;
  }

  const secretInput = document.getElementById('secret');
  const rememberBox = document.getElementById('remember');

  const savedSecret = localStorage.getItem('admin_notify_secret');
  if (savedSecret) {
    secretInput.value = savedSecret;
    rememberBox.checked = true;
  }

  async function sendNotification() {
    const btn = document.getElementById('send-btn');
    const msg = document.getElementById('msg');
    const secret = secretInput.value.trim();
    const title = document.getElementById('title').value.trim();
    const body = document.getElementById('body').value.trim();
    const url = document.getElementById('url').value.trim();

    msg.className = 'msg';
    msg.textContent = '';

    if (!secret) {
      msg.className = 'msg err';
      msg.textContent = 'Preenche o segredo de admin.';
      return;
    }
    if (!title || !body) {
      msg.className = 'msg err';
      msg.textContent = 'Preenche o título e a mensagem.';
      return;
    }

    if (rememberBox.checked) {
      localStorage.setItem('admin_notify_secret', secret);
    } else {
      localStorage.removeItem('admin_notify_secret');
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
      const res = await fetch('/api/admin/notify_update', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Secret': secret
        },
        body: JSON.stringify({ title, body, url: url || undefined })
      });
      const data = await res.json();

      if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = 'Erro: ' + (data.error || res.status);
      } else {
        msg.className = 'msg ok';
        msg.textContent = `Enviado! ${data.sent} ${pl(data.sent, 'entregue', 'entregues')}, ${data.failed} ${pl(data.failed, 'falha', 'falhas')}, ${data.removed} ${pl(data.removed, 'inscrição morta removida', 'inscrições mortas removidas')}, de ${data.total} no total.`;
      }
    } catch (e) {
      msg.className = 'msg err';
      msg.textContent = 'Falha de rede: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar notificação';
    }

    loadUpdatesList();
  }

  async function loadUpdatesList() {
    const list = document.getElementById('updates-list');
    selectedIds.clear();
    updateSelectedCount();

    const secret = secretInput.value.trim();
    if (!secret) {
      list.innerHTML = '<div style="color:#777; font-size:13px;">Preenche o segredo de admin acima pra ver a lista.</div>';
      return;
    }

    list.innerHTML = '<div style="color:#777; font-size:13px;">Carregando...</div>';
    try {
      const res = await fetch('/api/admin/updates', {
        headers: { 'X-Admin-Secret': secret }
      });
      if (!res.ok) {
        list.innerHTML = '<div style="color:#ff9b9b; font-size:13px;">Segredo inválido ou sem permissão.</div>';
        return;
      }
      const data = await res.json();
      const updates = data.updates || [];
      if (!updates.length) {
        list.innerHTML = '<div style="color:#777; font-size:13px;">Nenhuma novidade ainda.</div>';
        return;
      }
      list.innerHTML = '';
      for (const u of updates) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; gap:10px; background:#111; border:1px solid #2c2c2c; border-radius:10px; padding:10px 12px;';
        row.innerHTML = `
          <input type="checkbox" data-id="${u.id}" class="cb-custom">
          <div style="min-width:0; flex:1;">
            <div style="font-size:13px; font-weight:600; color:#eee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(u.title)}</div>
            <div style="font-size:12px; color:#999; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(u.body)}</div>
          </div>
          <button data-id="${u.id}" style="all:unset; cursor:pointer; color:#ff9b9b; padding:4px 8px; flex-shrink:0; display:flex; align-items:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        `;
        const checkbox = row.querySelector('input[type=checkbox]');
        checkbox.onchange = () => {
          if (checkbox.checked) selectedIds.add(u.id);
          else selectedIds.delete(u.id);
          updateSelectedCount();
        };
        row.querySelector('button').onclick = () => deleteUpdate(u.id);
        list.appendChild(row);
      }
    } catch (e) {
      list.innerHTML = '<div style="color:#ff9b9b; font-size:13px;">Falha ao carregar.</div>';
    }
  }

  function updateSelectedCount() {
    const el = document.getElementById('selected-count');
    el.textContent = selectedIds.size ? `${selectedIds.size} ${pl(selectedIds.size, 'selecionada', 'selecionadas')}` : '';
  }

  function toggleSelectAll() {
    const boxes = document.querySelectorAll('#updates-list input[type=checkbox]');
    const allChecked = boxes.length > 0 && [...boxes].every(b => b.checked);
    boxes.forEach(b => {
      b.checked = !allChecked;
      const id = Number(b.dataset.id);
      if (!allChecked) selectedIds.add(id);
      else selectedIds.delete(id);
    });
    updateSelectedCount();
  }

  let confirmResolve = null;
  function askConfirm(text) {
    document.getElementById('confirm-text').textContent = text;
    document.getElementById('confirm-overlay').classList.add('active');
    return new Promise((resolve) => { confirmResolve = resolve; });
  }
  function closeConfirm(result) {
    document.getElementById('confirm-overlay').classList.remove('active');
    if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
  }

  async function deleteSelected() {
    const secret = secretInput.value.trim();
    if (!secret) {
      alert('Preenche o segredo de admin primeiro pra poder apagar.');
      return;
    }
    if (!selectedIds.size) {
      alert('Marca pelo menos uma pra apagar.');
      return;
    }
    const n = selectedIds.size;
    const ok = await askConfirm(`Realmente apagar ${n} novidade${n > 1 ? 's' : ''}? Isso remove pra todo mundo.`);
    if (!ok) return;

    try {
      const res = await fetch('/api/admin/delete_update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': secret },
        body: JSON.stringify({ ids: [...selectedIds] })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert('Erro ao apagar: ' + (data.error || res.status));
        return;
      }
      loadUpdatesList();
    } catch (e) {
      alert('Falha de rede: ' + e.message);
    }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  async function deleteUpdate(id) {
    const secret = secretInput.value.trim();
    if (!secret) {
      alert('Preenche o segredo de admin primeiro pra poder apagar.');
      return;
    }
    const ok = await askConfirm('Realmente apagar essa novidade? Isso remove pra todo mundo.');
    if (!ok) return;

    try {
      const res = await fetch('/api/admin/delete_update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': secret },
        body: JSON.stringify({ id })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert('Erro ao apagar: ' + (data.error || res.status));
        return;
      }
      loadUpdatesList();
    } catch (e) {
      alert('Falha de rede: ' + e.message);
    }
  }

  loadUpdatesList();
</script>
</body>
</html>
