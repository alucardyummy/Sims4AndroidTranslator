<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar Novidade — Sims 4 Translator</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f0f0f;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #1a1a1a;
    border: 1px solid #2c2c2c;
    border-radius: 16px;
    padding: 28px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .sub {
    color: #999;
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #bbb;
    margin: 16px 0 6px;
  }
  input, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #8a7fa6;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 13px;
    color: #999;
  }
  .cb-wrap {
    position: relative;
    width: 22px;
    height: 22px;
    min-width: 22px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .cb-native {
    position: absolute;
    inset: 0;
    width: 22px;
    height: 22px;
    margin: 0;
    padding: 0;
    border: none;
    background: transparent;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
  }
  .cb-icon {
    position: absolute;
    inset: 0;
    width: 22px;
    height: 22px;
    pointer-events: none;
    transition: transform .08s ease;
  }
  .cb-icon-on { display: none; }
  .cb-native:checked ~ .cb-icon-off { display: none; }
  .cb-native:checked ~ .cb-icon-on { display: block; }
  .cb-native:active ~ .cb-icon-off,
  .cb-native:active ~ .cb-icon-on { transform: scale(0.9); }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #8a7fa6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  button:active:not(:disabled) { transform: scale(0.98); }
  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    white-space: pre-wrap;
  }
  .msg.ok { display: block; background: #212f2c; color: #9cb8b2; border: 1px solid #4a6660; }
  .msg.err { display: block; background: #3a1616; color: #ff9b9b; border: 1px solid #6b1f1f; }

  .confirm-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; padding: 24px; z-index: 100;
  }
  .confirm-overlay.active { display: flex; }
  .confirm-box {
    width: 100%; max-width: 340px; background: #1a1a1a; border: 1px solid #2c2c2c;
    border-radius: 16px; padding: 22px;
  }
  .confirm-box p { margin: 0 0 20px; font-size: 14px; color: #ddd; line-height: 1.4; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-actions button { margin-top: 0; width: 100%; }
  .confirm-actions .btn-no { background: #2c2c2c; color: #ccc; }
  .confirm-actions .btn-yes { background: #c94f4f; }
</style>
</head>

    <div class="confirm-box">
      <p id="confirm-text">Realmente apagar?</p>
      <div class="confirm-actions">
        <button type="button" class="btn-no" onclick="closeConfirm(false)">Não</button>
        <button type="button" class="btn-yes" onclick="closeConfirm(true)">Sim</button>

      <label for="remember" style="margin:0;">Lembrar neste navegador</label>

    <label for="title" style="display:flex; align-items:center; justify-content:space-between;">
      <span>Título</span>
      <span id="editing-badge" style="display:none; font-size:11px; font-weight:400; color:#9cb8b2;">
        Editando novidade
        <a href="#" id="cancel-edit-link" style="color:#8a7fa6; margin-left:6px;">cancelar</a>
      </span>
    </label>
    <input type="text" id="title" placeholder="Ex: Tradução atualizada!" maxlength="80">

    <label for="body">Mensagem</label>
    <textarea id="body" rows="3" placeholder="Ex: Já dá pra baixar a versão nova." maxlength="200"></textarea>

    <label for="url">Link ao clicar (opcional)</label>
    <input type="text" id="url" placeholder="/ (padrão)">

    <button id="send-btn" onclick="sendNotification()">Enviar notificação</button>

    <div id="msg" class="msg"></div>

    <label style="margin-top:28px; display:flex; align-items:center; justify-content:space-between;">
      <span>Novidades enviadas</span>
      <span id="selected-count" style="color:#777; font-weight:400;"></span>
    </label>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button type="button" onclick="toggleSelectAll()" style="all:unset; cursor:pointer; font-size:12px; color:#8a7fa6; padding:4px 8px;" id="select-all-btn">Selecionar tudo</button>
      <button type="button" onclick="deleteSelected()" style="all:unset; cursor:pointer; font-size:12px; color:#ff9b9b; padding:4px 8px; display:inline-flex; align-items:center; gap:5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Apagar selecionados
      </button>
    </div>
    <div id="updates-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

<script>
  const selectedIds = new Set();
  let editingId = null;

  const editingBadge = document.getElementById('editing-badge');
  document.getElementById('cancel-edit-link').onclick = (e) => {
    e.preventDefault();
    cancelEdit();
  };

  function startEdit(u) {
    editingId = u.id;
    document.getElementById('title').value = u.title;
    document.getElementById('body').value = u.body;
    document.getElementById('url').value = (u.url && u.url !== '/') ? u.url : '';
    editingBadge.style.display = 'inline';
    document.getElementById('send-btn').textContent = 'Salvar edição';
    document.getElementById('title').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('title').value = '';
    document.getElementById('body').value = '';
    document.getElementById('url').value = '';
    editingBadge.style.display = 'none';
    document.getElementById('send-btn').textContent = 'Enviar notificação';
  }

  function pl(n, singular, plural) {
    return n === 1 ? singular : plural;
  }

  const secretInput = document.getElementById('secret');
  const rememberBox = document.getElementById('remember');

  const savedSecret = localStorage.getItem('admin_notify_secret');
  if (savedSecret) {
    secretInput.value = savedSecret;
    rememberBox.checked = true;
  }

  async function sendNotification() {
    if (editingId) {
      return saveEdit();
    }

    const btn = document.getElementById('send-btn');
    const msg = document.getElementById('msg');
    const secret = secretInput.value.trim();
    const title = document.getElementById('title').value.trim();
    const body = document.getElementById('body').value.trim();
    const url = document.getElementById('url').value.trim();

    msg.className = 'msg';
    msg.textContent = '';

    if (!secret) {
      msg.className = 'msg err';
      msg.textContent = 'Preenche o segredo de admin.';
      return;
    }
    if (!title || !body) {
      msg.className = 'msg err';
      msg.textContent = 'Preenche o título e a mensagem.';
      return;
    }

    if (rememberBox.checked) {
      localStorage.setItem('admin_notify_secret', secret);
    } else {
      localStorage.removeItem('admin_notify_secret');
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
      const res = await fetch('/api/admin/notify_update', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Secret': secret
        },
        body: JSON.stringify({ title, body, url: url || undefined })
      });
      const data = await res.json();

      if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = 'Erro: ' + (data.error || res.status);
      } else {
        msg.className = 'msg ok';
        msg.textContent = `Enviado! ${data.sent} ${pl(data.sent, 'entregue', 'entregues')}, ${data.failed} ${pl(data.failed, 'falha', 'falhas')}, ${data.removed} ${pl(data.removed, 'inscrição morta removida', 'inscrições mortas removidas')}, de ${data.total} no total.`;
      }
    } catch (e) {
      msg.className = 'msg err';
      msg.textContent = 'Falha de rede: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar notificação';
    }

    loadUpdatesList();
  }

  async function saveEdit() {
    const btn = document.getElementById('send-btn');
    const msg = document.getElementById('msg');
    const secret = secretInput.value.trim();
    const title = document.getElementById('title').value.trim();
    const body = document.getElementById('body').value.trim();
    const url = document.getElementById('url').value.trim();

    msg.className = 'msg';
    msg.textContent = '';

    if (!secret) {
      msg.className = 'msg err';
      msg.textContent = 'Preenche o segredo de admin.';
      return;
    }
    if (!title || !body) {
      msg.className = 'msg err';
      msg.textContent = 'Preenche o título e a mensagem.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Salvando...';

    try {
      const res = await fetch('/api/admin/edit_update', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Secret': secret
        },
        body: JSON.stringify({ id: editingId, title, body, url: url || undefined })
      });
      const data = await res.json();

      if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = 'Erro: ' + (data.error || res.status);
      } else {
        msg.className = 'msg ok';
        msg.textContent = 'Editado! Quem ainda tiver a notificação na barra vê o texto atualizado, sem alerta novo.';
        cancelEdit();
      }
    } catch (e) {
      msg.className = 'msg err';
      msg.textContent = 'Falha de rede: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = editingId ? 'Salvar edição' : 'Enviar notificação';
    }

    loadUpdatesList();
  }

  async function loadUpdatesList() {
    const list = document.getElementById('updates-list');
    selectedIds.clear();
    updateSelectedCount();

    const secret = secretInput.value.trim();
    if (!secret) {
      list.innerHTML = '<div style="color:#777; font-size:13px;">Preenche o segredo de admin acima pra ver a lista.</div>';
      return;
    }

    list.innerHTML = '<div style="color:#777; font-size:13px;">Carregando...</div>';
    try {

          if (checkbox.checked) selectedIds.add(u.id);
          else selectedIds.delete(u.id);
          updateSelectedCount();
        };
        row.querySelector('.edit-btn').onclick = () => startEdit(u);

    }

  function updateSelectedCount() {
    const el = document.getElementById('selected-count');
    el.textContent = selectedIds.size ? `${selectedIds.size} ${pl(selectedIds.size, 'selecionada', 'selecionadas')}` : '';
  }

  function toggleSelectAll() {
    const boxes = document.querySelectorAll('#updates-list input[type=checkbox]');
    const allChecked = boxes.length > 0 && [...boxes].every(b => b.checked);
    boxes.forEach(b => {
      b.checked = !allChecked;
      const id = Number(b.dataset.id);
      if (!allChecked) selectedIds.add(id);
      else selectedIds.delete(id);
    });
    updateSelectedCount();
  }

  let confirmResolve = null;
  function askConfirm(text) {
    document.getElementById('confirm-text').textContent = text;
    document.getElementById('confirm-overlay').classList.add('active');
    return new Promise((resolve) => { confirmResolve = resolve; });
  }
  function closeConfirm(result) {
    document.getElementById('confirm-overlay').classList.remove('active');
    if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
  }

  async function deleteSelected() {
    const secret = secretInput.value.trim();
    if (!secret) {
      alert('Preenche o segredo de admin primeiro pra poder apagar.');
      return;
    }
    if (!selectedIds.size) {
      alert('Marca pelo menos uma pra apagar.');
      return;
    }
    const n = selectedIds.size;
    const ok = await askConfirm(`Realmente apagar ${n} novidade${n > 1 ? 's' : ''}? Isso remove pra todo mundo.`);
    if (!ok) return;

    try {
      const res = await fetch('/api/admin/delete_update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': secret },
        body: JSON.stringify({ ids: [...selectedIds] })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert('Erro ao apagar: ' + (data.error || res.status));
        return;
      }
      loadUpdatesList();
    } catch (e) {
      alert('Falha de rede: ' + e.message);
    }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  async function deleteUpdate(id) {
    const secret = secretInput.value.trim();
    if (!secret) {
      alert('Preenche o segredo de admin primeiro pra poder apagar.');
      return;
    }
    const ok = await askConfirm('Realmente apagar essa novidade? Isso remove pra todo mundo.');
    if (!ok) return;

    try {
      const res = await fetch('/api/admin/delete_update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': secret },
        body: JSON.stringify({ id })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert('Erro ao apagar: ' + (data.error || res.status));
        return;
      }
      loadUpdatesList();
    } catch (e) {
      alert('Falha de rede: ' + e.message);
    }
  }

  loadUpdatesList();
